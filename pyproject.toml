[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-backup-recovery"
version = "1.0.0"
description = "A comprehensive Python-based backup solution with scheduling, compression, encryption, and retention policies"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Mani", email = "myfamily9006@gmail.com"}
]
keywords = ["backup", "restore", "encryption", "compression", "s3", "gcs", "azure", "cron"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: Utilities",
]
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "cryptography>=41.0.0",
    "croniter>=1.4.0",
]

[project.optional-dependencies]
s3 = ["boto3>=1.28.0"]
gcs = ["google-cloud-storage>=2.10.0"]
azure = ["azure-storage-blob>=12.17.0"]
sftp = ["paramiko>=3.3.0"]
webhook = ["requests>=2.31.0"]
all = [
    "boto3>=1.28.0",
    "google-cloud-storage>=2.10.0",
    "azure-storage-blob>=12.17.0",
    "paramiko>=3.3.0",
    "requests>=2.31.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
    "isort>=5.12.0",
]

[project.scripts]
backup-recovery = "src.cli:main"

[project.urls]
Homepage = "https://github.com/example/backup-recovery"
Documentation = "https://github.com/example/backup-recovery/blob/main/docs/architecture.md"
Repository = "https://github.com/example/backup-recovery"
Issues = "https://github.com/example/backup-recovery/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tests*"]

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["src"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "tests/",
    '\\.venv/',
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
