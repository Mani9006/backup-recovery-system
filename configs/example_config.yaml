# Automated Backup & Recovery System - Example Configuration
#
# This file demonstrates all available configuration options for the
# backup system. Copy this file to config.yaml and customize for your
# environment.
#
# Environment variable substitution is supported:
#   ${VAR}           - Replace with environment variable value
#   ${VAR:-default}  - Use default if env var is not set

# Logging level: DEBUG, INFO, WARNING, ERROR, CRITICAL
log_level: INFO

# Storage backend configuration
storage:
  backend: local          # Options: local, s3, gcs, azure
  path: ./backups         # Local path for backups
  # bucket: my-backups    # Required for cloud backends
  # region: us-east-1     # Required for S3
  # access_key: ${AWS_ACCESS_KEY_ID}
  # secret_key: ${AWS_SECRET_ACCESS_KEY}
  # connection_string: ${AZURE_STORAGE_CONNECTION_STRING}

# Notification configuration
notifications:
  on_success: false
  on_failure: true
  # webhook_url: https://hooks.slack.com/services/T00/B00/XXXX
  # email_to: admin@example.com
  # email_from: backup@example.com
  # smtp_host: smtp.example.com
  # smtp_port: 587

# Backup job definitions
jobs:
  # Example 1: File system backup
  documents:
    type: file
    schedule: "0 2 * * *"      # Daily at 2:00 AM
    source: ./documents        # Source directory
    destination: documents     # Backup name prefix
    compression: gzip          # gzip, zip, or none
    encryption: false
    retention:
      daily: 7                 # Keep 7 daily backups
      weekly: 4                # Keep 4 weekly backups
      monthly: 12              # Keep 12 monthly backups
    enabled: true
    options:
      exclude:
        - "*.tmp"
        - "*.log"
        - ".cache"
      skip_hidden: false

  # Example 2: Database backup (PostgreSQL)
  postgres_main:
    type: database
    schedule: "0 3 * * *"      # Daily at 3:00 AM
    source: mydb
    destination: postgres
    compression: gzip
    encryption: true
    encryption_key: ${BACKUP_ENCRYPTION_KEY}
    retention:
      daily: 7
      weekly: 4
      monthly: 6
    enabled: true
    options:
      engine: postgresql
      host: localhost
      port: 5432
      username: backup_user
      password: ${DB_PASSWORD}
      database: mydb
      custom_args:
        - "--no-owner"
        - "--no-privileges"

  # Example 3: Database backup (MySQL)
  mysql_app:
    type: database
    schedule: "0 4 * * *"
    source: appdb
    destination: mysql
    compression: gzip
    encryption: false
    retention:
      daily: 14
      weekly: 8
      monthly: 6
    enabled: true
    options:
      engine: mysql
      host: localhost
      port: 3306
      username: root
      password: ${MYSQL_ROOT_PASSWORD}
      database: appdb

  # Example 4: Cloud resource backup (S3)
  s3_metadata:
    type: cloud
    schedule: "0 5 * * 0"      # Weekly on Sunday at 5:00 AM
    source: s3://my-bucket
    destination: s3_backups
    compression: zip
    encryption: false
    retention:
      daily: 7
      weekly: 8
      monthly: 12
    enabled: true
    options:
      source_cloud: s3
      source_bucket: my-bucket
      source_prefix: data/
      source_region: us-east-1
      sync_mode: metadata

  # Example 5: SQLite database backup
  sqlite_data:
    type: database
    schedule: "0 1 * * *"
    source: ./data/app.db
    destination: sqlite
    compression: gzip
    encryption: false
    retention:
      daily: 14
      weekly: 4
    enabled: true
    options:
      engine: sqlite

  # Example 6: GCS resource backup
  gcs_assets:
    type: cloud
    schedule: "0 6 * * 0"
    source: gs://my-assets
    destination: gcs_backups
    compression: zip
    encryption: false
    retention:
      daily: 7
      weekly: 8
      monthly: 12
    enabled: false
    options:
      source_cloud: gcs
      source_bucket: my-assets
      source_prefix: uploads/
      sync_mode: metadata

  # Example 7: Encrypted file backup
  encrypted_docs:
    type: file
    schedule: "0 23 * * *"     # Daily at 11:00 PM
    source: ./sensitive
    destination: sensitive_docs
    compression: gzip
    encryption: true
    encryption_key: ${SENSITIVE_ENCRYPTION_KEY}
    retention:
      daily: 30
      weekly: 12
      monthly: 24
    enabled: true
    options:
      exclude:
        - "*.cache"
        - ".git"
